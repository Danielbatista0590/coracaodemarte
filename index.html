<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coração de Marte</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0b1a; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; touch-action: none; }
    body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overflow: hidden; }
    #girar { display: none; position: fixed; inset: 0; background: #0d0b1a; color: #fff; font: 22px Arial; z-index: 9;
             align-items: center; justify-content: center; text-align: center; padding: 24px; }
    @media (orientation: portrait) and (pointer: coarse) { #girar { display: flex; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="girar">📱↻<br><br>Vire o celular deitado para jogar</div>
  <script src="game.js"></script>
</body>
</html>
