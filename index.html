<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coração de Marte</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0b1a; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; touch-action: none; }
    body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overflow: hidden; }
    #girar { display: none; position: fixed; left: 0; right: 0; top: 0; background: #2b2350; color: #fff; font: 15px Arial; z-index: 9;
             text-align: center; padding: 10px 36px 10px 10px; }
    #girar b { position: absolute; right: 12px; top: 8px; font-size: 20px; }
    @media (orientation: portrait) and (pointer: coarse) { #girar { display: flex; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="girar" onclick="this.remove()">📱↻ Fica melhor com o celular deitado. Se a tela não girar, ative a rotação automática do celular. <b>✕</b></div>
  <script src="game.js"></script>
</body>
</html>
